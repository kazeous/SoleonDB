name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: eousbot_test
          POSTGRES_PASSWORD: local-disposable-test
          POSTGRES_DB: eousbot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U eousbot_test -d eousbot_test"
          --health-interval=2s --health-timeout=3s --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql://eousbot_test:local-disposable-test@127.0.0.1:5432/eousbot_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
          cache: npm
      - run: npm ci
      - run: npx @e2e-dev/web install chromium --with-deps
      - run: npm run check
      - run: docker build -t eousbot:check .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-evidence
          path: .e2e/
          include-hidden-files: true
